<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #f8fafc;
    }
    .lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #94a3b8;
    }
  </style>

  <!-- Container Base -->
  <rect width="900" height="160" rx="10" fill="url(#mBgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card 1: Trayectoria -->
  <g transform="translate(25, 20)">
    <rect width="195" height="120" rx="8" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="3" rx="1.5" fill="url(#cyanLine)"/>
    <text x="16" y="38" class="val">20+ Años</text>
    <text x="16" y="60" class="lbl">Sistemas Críticos</text>
    <text x="16" y="82" class="desc">Aviónica, hardware, redes</text>
    <text x="16" y="98" class="desc">y mantenimiento operativo</text>
  </g>

  <!-- Card 2: Modern Stack -->
  <g transform="translate(240, 20)">
    <rect width="195" height="120" rx="8" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="3" rx="1.5" fill="#61dafb"/>
    <text x="16" y="38" class="val">Full-Stack</text>
    <text x="16" y="60" class="lbl" fill="#61dafb">Arquitectura Web</text>
    <text x="16" y="82" class="desc">React 19, Next.js 15,</text>
    <text x="16" y="98" class="desc">PostgreSQL y Tailwind v4</text>
  </g>

  <!-- Card 3: AI & Spec-Kit -->
  <g transform="translate(455, 20)">
    <rect width="195" height="120" rx="8" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="3" rx="1.5" fill="#a855f7"/>
    <text x="16" y="38" class="val">AI-First</text>
    <text x="16" y="60" class="lbl" fill="#c084fc">Spec-Driven Dev</text>
    <text x="16" y="82" class="desc">Orquestación multiagente,</text>
    <text x="16" y="98" class="desc">guardrails y gobernanza</text>
  </g>

  <!-- Card 4: Quality & Resilience -->
  <g transform="translate(670, 20)">
    <rect width="205" height="120" rx="8" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="205" height="3" rx="1.5" fill="#10b981"/>
    <text x="16" y="38" class="val">Resilience</text>
    <text x="16" y="60" class="lbl" fill="#34d399">Calidad &amp; Offline</text>
    <text x="16" y="82" class="desc">PWA Offline-First, Vitest</text>
    <text x="16" y="98" class="desc">y CI/CD con GitHub Actions</text>
  </g>
</svg>
